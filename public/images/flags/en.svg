<svg width="24" height="18" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background -->
  <rect width="3" height="2" fill="#012169"/>
  
  <!-- St Andrew's Cross (white diagonals) -->
  <path d="M0,0 L3,2" stroke="#fff" stroke-width="0.35" stroke-linecap="square"/>
  <path d="M3,0 L0,2" stroke="#fff" stroke-width="0.35" stroke-linecap="square"/>
  
  <!-- St Andrew's Cross (red diagonals) -->
  <path d="M0,0 L3,2" stroke="#c8102e" stroke-width="0.2" stroke-linecap="square"/>
  <path d="M3,0 L0,2" stroke="#c8102e" stroke-width="0.2" stroke-linecap="square"/>
  
  <!-- St George's Cross (white vertical and horizontal) -->
  <rect x="1.3" width="0.4" height="2" fill="#fff"/>
  <rect width="3" height="0.4" y="0.8" fill="#fff"/>
  
  <!-- St George's Cross (red vertical and horizontal) -->
  <rect x="1.375" width="0.25" height="2" fill="#c8102e"/>
  <rect width="3" height="0.25" y="0.875" fill="#c8102e"/>
</svg>
